name: NeoForge 1.21.1 Build
on:
  push:
    branches: [ neoforge-1.21.1-stage37, experiment/standalone-orca-1.21.1 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify recovered orca assets and source readiness
        run: |
          python3 scripts/check_orca_fidelity.py
          python3 scripts/check_orca_source_readiness.py
      - name: Compile and package NeoForge mod
        run: gradle build --stacktrace
      - name: Verify packaged NeoForge mod metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          jars = [p for p in Path('build/libs').glob('*.jar') if not p.name.endswith(('-sources.jar', '-javadoc.jar'))]
          assert jars, 'No compiled mod JAR found'
          with ZipFile(jars[0]) as archive:
              metadata = archive.read('META-INF/neoforge.mods.toml').decode('utf-8')
          assert 'modId="zawa"' in metadata, f'Incorrect mod ID in metadata: {metadata}'
          assert '${' not in metadata, 'Unexpanded Gradle placeholders remain in mod metadata'
          print('PASS: NeoForge mod metadata is fully expanded')
          PY
      - name: Verify packaged orca audio assets
        if: success()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          jars = sorted(Path('build/libs').glob('*.jar'))
          assert jars, 'No built mod JAR found'
          with ZipFile(jars[0]) as jar:
              paths = set(jar.namelist())
              definitions = json.loads(jar.read('assets/zawa/sounds.json'))
              for event in ('orca_ambient', 'orca_hurt', 'orca_attacking', 'orca_broadcast'):
                  assert event in definitions, f'Missing sound event: {event}'
                  for entry in definitions[event]['sounds']:
                      name = entry if isinstance(entry, str) else entry['name']
                      namespace, sound = name.split(':', 1)
                      asset = f'assets/{namespace}/sounds/{sound}.ogg'
                      assert asset in paths, f'Missing audio asset: {asset}'
              print('Orca sound events and packaged OGG assets verified')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zawa-neoforge-build
          path: |
            build/libs/*.jar
            build/reports/**
