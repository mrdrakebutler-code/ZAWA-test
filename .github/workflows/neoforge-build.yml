name: NeoForge 1.21.1 Build

on:
  push:
    branches: [ neoforge-1.21.1-stage37 ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle build --stacktrace
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zawa-neoforge-1.21.1
          path: build/libs/*.jar
